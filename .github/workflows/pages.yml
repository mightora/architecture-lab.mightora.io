name: Deploy Architecture Lab to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: bash scripts/prepare-vendor.sh
      - run: node scripts/check-renderer-assets.mjs
      - run: node scripts/check-scenarios.mjs
      - run: node scripts/check-scenario-ui.mjs
      - run: node scripts/check.mjs
      - run: node scripts/check-syntax.mjs
      - run: node scripts/check-svg-export.mjs
      - run: python3 scripts/check-office.py
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
